<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />

    <!-- viewport-fit=cover lets the shell paint under the notch / safe areas -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS standalone / full-screen launch -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PocketOS" />

    <meta
      name="description"
      content="PocketOS turns your phone browser into a desktop: real windows, a virtual filesystem, a terminal and apps, fully offline."
    />
    <title>PocketOS</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 24px; color: #e7e9ee; background: #0b0d12">
        PocketOS needs JavaScript to run. Please enable it.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
